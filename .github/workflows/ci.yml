
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format=%s "$BASE_SHA..$HEAD_SHA" |
          while IFS= read -r message; do
            if ! printf '%s\n' "$message" |
              grep -Eq '^(feat|fix|docs|style|refactor|test|chore|perf|build|ci|revert)(\([a-zA-Z0-9._/-]+\))?(!)?: .+'; then
              echo "Invalid commit message: $message"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run tsc

      - name: Run tests
        run: npm test

      # Pruebas de seguridad contra el proyecto de Supabase de desarrollo. Las llaves vienen de los
      # secretos del repositorio; los PR desde forks no las tienen y se saltan este paso.
      - name: Run database tests
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODERATOR_TEST_TOKEN: ${{ secrets.MODERATOR_TEST_TOKEN }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Sin secretos de Supabase: se saltan las pruebas de la base de datos."
            exit 0
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env
          printf 'SUPABASE_SECRET_KEY=%s\nMODERATOR_TEST_TOKEN=%s\n' \
            "$SUPABASE_SECRET_KEY" "$MODERATOR_TEST_TOKEN" > db-tests/.env.test
          npm run test:db
